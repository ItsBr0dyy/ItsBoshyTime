<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands | ItsBoshyTime</title>
    <link rel="icon" href="itsboshytime.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: #e6e6e6;
            font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
            font-size: 15px;
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .forsen-boshy {
            width: min(220px, 100%);
        }

        .bosh {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .title {
            display: flex;
            align-items: center;
        }

        h1 {
            color: yellow;
            font-family: "VT323", monospace;
            font-weight: 400;
            font-size: 52px;
            margin: 0;
        }

        .boshy {
            width: 52px;
            height: 52px;
        }

        .creator {
            color: white;
            font-family: "VT323", monospace;
            font-size: 26px;
            margin: 4px 0 0;
        }

        .creator a {
            background-image: url("d9.webp");
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            font-weight: bold;
        }

        .creator a:hover {
            text-decoration: underline;
        }

        h2 {
            font-size: 28px;
            margin: 0 0 14px;
        }

        .note {
            margin: 0 0 12px;
        }

        .note.hint {
            color: #888;
        }

        #search {
            width: 100%;
            max-width: 420px;
            background: #111;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 15px;
            margin-bottom: 12px;
        }

        #search:focus {
            outline: none;
            border-color: yellow;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #4a4a4a;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #3a3a3a;
            font-weight: 700;
        }

        tr.cmd td {
            background: #141414;
        }

        tr.cmd.has-ex {
            cursor: pointer;
        }

        tr.cmd.has-ex:hover td {
            background: #1d1d1d;
        }

        tr.cmd.open td {
            background: #1d1d1d;
        }

        tr.ex td {
            background: #0c0c0c;
            padding: 6px 10px 12px 28px;
        }

        .caret {
            display: inline-block;
            width: 14px;
            color: #666;
        }

        tr.cmd.open .caret {
            color: yellow;
        }

        .tag {
            font-size: 12px;
            margin-left: 8px;
            padding: 0 6px;
            border: 1px solid;
            border-radius: 3px;
        }

        .tag.helper {
            color: #ffb347;
            border-color: #ffb347;
        }

        .tag.owner {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .example {
            border-left: 3px solid #333;
            padding-left: 10px;
            margin-top: 8px;
            word-break: break-word;
        }

        .example .in {
            color: #8ecbff;
        }

        .example .out {
            color: #cfcfcf;
        }

        code {
            background: #1a1a1a;
            padding: 0 6px;
            border-radius: 3px;
        }

        .status {
            color: #888;
            text-align: center;
            padding: 24px;
        }

        td.usage {
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="forsenboshy.webp" class="forsen-boshy">

        <div class="bosh">
            <div class="title">
                <h1>ItsBoshyTime</h1>
                <img src="itsboshytime.png" class="boshy">
            </div>

            <p class="creator">
                Say hi to my creator
                <a href="https://itsbr0dyy.dev" target="_blank">@ItsBr0dyy</a>
            </p>
        </div>
    </div>

    <h2>Bot commands</h2>
    <p class="note" id="note"></p>
    <p class="note hint">click a command to see examples (yes slop commands page; will change eventually) to get the bot added in your channel, ask in #itsbr0dyy</p>

    <input id="search" type="search" placeholder="search commands..." autocomplete="off">

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Command</th>
                    <th>Usage</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr><td colspan="3" class="status">Loading commands...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const rows = document.getElementById('rows');
        const note = document.getElementById('note');
        const search = document.getElementById('search');
        let data = null;

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function fmtUsage(u) {
            return u.replace(/<([^>]+)>/g, '*[$1]');
        }

        function ordered() {
            const cats = [...(data.categories || [])];
            for (const c of data.commands) {
                if (!cats.includes(c.category)) cats.push(c.category);
            }
            return cats.flatMap(cat => data.commands.filter(c => c.category === cat));
        }

        function matches(c, q) {
            if (!q) return true;
            return [c.name, ...(c.aliases || []), c.usage, c.description, c.category]
                .join(' ').toLowerCase().includes(q);
        }

        function render() {
            const q = search.value.trim().toLowerCase();
            const p = data.prefix;
            rows.replaceChildren();

            let shown = 0;
            for (const c of ordered()) {
                if (!matches(c, q)) continue;
                shown++;

                const hasEx = c.examples && c.examples.length;
                const tr = el('tr', 'cmd' + (hasEx ? ' has-ex' : ''));

                const name = el('td');
                name.appendChild(el('span', 'caret', hasEx ? '\u25B8' : ''));
                let label = p + c.name;
                if (c.aliases && c.aliases.length) {
                    label += ' (' + c.aliases.map(a => p + a).join(', ') + ')';
                }
                name.append(label);
                if (c.access !== 'Everyone') {
                    name.appendChild(el('span', 'tag ' + c.access.toLowerCase(), c.access.toLowerCase()));
                }

                tr.append(name, el('td', 'usage', p + fmtUsage(c.usage)), el('td', '', c.description));
                rows.appendChild(tr);

                if (hasEx) {
                    const ex = el('tr', 'ex');
                    ex.hidden = true;
                    const td = el('td');
                    td.colSpan = 3;
                    for (const e of c.examples) {
                        const box = el('div', 'example');
                        box.appendChild(el('div', 'in', p + e.input));
                        box.appendChild(el('div', 'out', e.output));
                        td.appendChild(box);
                    }
                    ex.appendChild(td);
                    rows.appendChild(ex);

                    tr.addEventListener('click', () => {
                        ex.hidden = !ex.hidden;
                        tr.classList.toggle('open', !ex.hidden);
                        tr.querySelector('.caret').textContent = ex.hidden ? '\u25B8' : '\u25BE';
                    });
                }
            }

            if (!shown) {
                const tr = el('tr');
                const td = el('td', 'status', 'No commands match your search.');
                td.colSpan = 3;
                tr.appendChild(td);
                rows.appendChild(tr);
            }
        }

        search.addEventListener('input', () => data && render());

        fetch('commands.json')
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(d => {
                data = d;

                note.append('parameters with an asterisk are required, you can also mention ');
                note.appendChild(el('code', '', '@' + d.bot));
                note.append(' instead of the prefix (');
                note.appendChild(el('code', '', '@' + d.bot + ' ping'));
                note.append(')');

                render();
            })
            .catch(err => {
                rows.replaceChildren();
                const tr = el('tr');
                const td = el('td', 'status',
                    'Could not load commands.json (' + err.message + '). If you opened this file directly, serve the folder over http instead.');
                td.colSpan = 3;
                tr.appendChild(td);
                rows.appendChild(tr);
            });
    </script>
</body>
</html>
