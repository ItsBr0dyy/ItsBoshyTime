<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItsBoshyTime</title>
    <link rel="icon" href="itsboshytime.png" type="image/png">
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    body {
        background-color: black;
    }

    .header {
        display: flex;
        align-items: center;
    }

    .forsen-boshy {
        width: 60%;
    }

    .bosh {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .title {
        display: flex;
        align-items: center;
    }

    h1 {
        color: yellow;
        font-family: "VT323", monospace;
        font-weight: 400;
        font-size: 550%;
        margin: 0;
    }

    .boshy {
        width: 100px;
        height: 100px;
    }

    .creator {
        color: white;
        font-family: "VT323", monospace;
        font-size: 32px;
        margin-top: 10px;
    }

    .creator a {
        background-image: url("d9.webp");
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-decoration: none;
        font-weight: bold;
    }

    .creator a:hover {
        text-decoration: underline;
    }
</style>

<body>
    <div class="header">
        <img src="forsenboshy.webp" class="forsen-boshy">

        <div class="bosh">
            <div class="title">
                <h1>ItsBoshyTime</h1>
                <img src="itsboshytime.png" class="boshy">

            <p class="creator">
                Say hi to my creator
                <a href="https://itsbr0dyy.dev" target="_blank">@ItsBr0dyy</a>
